name: Deploy NEXRA Code AI Website

on:
  workflow_dispatch:
  push:
    paths:
      - "NEXRA-Code-AI-Android.zip"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          test -f NEXRA-Code-AI-Android.zip || {
            echo "ไม่พบ NEXRA-Code-AI-Android.zip ที่ root ของ repository"
            exit 1
          }
          mkdir extracted
          unzip -q NEXRA-Code-AI-Android.zip -d extracted

      - name: Prepare static website
        run: |
          mkdir -p dist
          test -f extracted/NEXRA-Code-AI/web/index.html
          cp -R extracted/NEXRA-Code-AI/web/. dist/
          touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
